<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Black Owl HR Virtual Office</title><style>
*{box-sizing:border-box}body{margin:0;background:#14171c;color:#eae8e3;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1,h2{color:#e0c38b;margin:0 0 8px}h1{letter-spacing:3px}small,p{color:#a9afb9}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:12px;margin:20px 0}.stats div{flex:1;background:#242831;padding:14px;border-radius:9px}.stats b{display:block;color:#e0c38b;font-size:26px}.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px;border:2px solid #8c7852;background:repeating-conic-gradient(#30343b 0 25%,#373b43 0 50%) 0 0/28px 28px}.desk{background:#40444b;border:1px solid #74716a;padding:9px;color:#f0d9b0;cursor:pointer;border-radius:5px}.desk:first-child{grid-column:1/-1;width:44%;justify-self:center}.desk.selected{outline:3px solid #e0c38b}.desk svg{display:block;width:100%;max-width:130px;margin:auto}.desk.busy .screen{animation:blink .7s infinite alternate}@keyframes blink{to{fill:#91e8cc}}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}section{background:#242831;border-radius:10px;padding:18px}textarea,input{width:100%;padding:10px;background:#14171c;color:white;border:1px solid #575d66;border-radius:6px;margin:7px 0;font:inherit}textarea{min-height:100px}button{font:inherit}button.action{border:0;background:#e0c38b;color:#16181c;border-radius:6px;padding:10px 13px;cursor:pointer;margin:4px 4px 4px 0}button.alt{background:#383e48;color:white}button:disabled{opacity:.5;cursor:wait}.task{border-top:1px solid #4b515a;padding:12px 0;overflow-wrap:anywhere}.output{white-space:pre-wrap;background:#181b21;padding:10px;border-radius:6px}#notice{color:#e0c38b} @media(max-width:650px){main{padding:12px}.layout{grid-template-columns:1fr}.floor{gap:6px;padding:8px}.desk{font-size:10px}}
</style><main><header><div><h1>BLACK OWL</h1><div>HR COMBEN & OPERATIONAL · DIGITAL WORKFORCE</div></div><small>V1.0 · PILOT / DUMMY DATA ONLY</small></header><p>Jangan masukkan informasi karyawan, payroll asli, NIK atau rekening. Mode demo tidak menjalankan AI.</p><div class="stats" id="stats"></div><div class="floor" id="floor"></div><div class="layout"><section><h2 id="role"></h2><p id="desc"></p><label for="task">Instruksi pekerjaan</label><textarea id="task" maxlength="3000"></textarea><button class="action alt" id="example">Contoh tugas</button><button class="action" id="demo">Simpan tugas demo</button><hr><label for="token">Kode akses pilot AI (opsional)</label><input id="token" type="password" autocomplete="off"><button class="action" id="run">Jalankan AI</button><p id="notice" role="status"></p></section><section><h2>Task Activity</h2><small>Riwayat dummy tersimpan lokal pada browser ini, bukan database bersama.</small><div id="history"></div><button class="action alt" id="export">Export JSON</button><button class="action alt" id="clear">Hapus riwayat</button></section></div></main><script>
const agents=[['coordinator','HR Coordinator','Koordinasi dan review laporan','Susun contoh weekly HR report.','#819ebd'],['payroll','Payroll Specialist','Validasi payroll dan rekonsiliasi','Buat checklist validasi payroll dengan data simulasi.','#78a6d4'],['benefit','Benefit Specialist','Administrasi benefit','Buat template simulasi biaya benefit tanpa data asli.','#cb9975'],['compensation','Compensation Analyst','Struktur upah dan manpower cost','Buat contoh metode analisis struktur upah.','#82b4a0'],['admin','HR Administrator','Kontrak dan employee movement','Buat checklist monitoring kontrak 90 hari.','#b59ad0'],['attendance','Attendance Specialist','Absensi, cuti dan overtime','Buat contoh checklist anomali absensi.','#77bdc6'],['analyst','HR Data Analyst','Headcount dan reporting','Susun format laporan headcount per outlet.','#cfb16c']];
const $=id=>document.getElementById(id);let selected=0,busy=false;let tasks=[];try{tasks=JSON.parse(localStorage.getItem('bo-demo-v1')||'[]');if(!Array.isArray(tasks))tasks=[];}catch{};tasks.forEach(t=>{if(t.status==='Running')t.status='Interrupted'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('bo-demo-v1',JSON.stringify(tasks))}catch{}render()}
function render(){ $('stats').innerHTML=`<div>AI Agents<b>7</b></div><div>Open tasks<b>${tasks.filter(t=>['Assigned','Running'].includes(t.status)).length}</b></div><div>Completed<b>${tasks.filter(t=>['AI completed','Demo completed'].includes(t.status)).length}</b></div>`;$('floor').innerHTML=agents.map((a,i)=>`<button class="desk ${i===selected?'selected':''} ${tasks.some(t=>t.agent===a[0]&&t.status==='Running')?'busy':''}" data-i="${i}"><svg viewBox="0 0 100 75" shape-rendering="crispEdges"><rect x="8" y="10" width="84" height="29" fill="#8d6b45"/><rect x="30" y="3" width="40" height="23" fill="#161a21"/><rect class="screen" x="34" y="6" width="32" height="16" fill="#39747c"/><path d="M38 10h24v2H38z M38 15h16v2H38z" fill="#9bd3c2"/><rect x="34" y="32" width="32" height="5" fill="#b9bbc0"/><rect x="34" y="48" width="32" height="23" fill="#1b1e23"/><rect x="37" y="49" width="26" height="17" fill="${a[4]}"/><rect x="42" y="40" width="16" height="15" fill="#d9ac8b"/><rect x="40" y="38" width="20" height="6" fill="#372a24"/></svg>${a[1]}<br><small>${tasks.some(t=>t.agent===a[0]&&t.status==='Running')?'Working':tasks.some(t=>t.agent===a[0]&&t.status==='Assigned')?'Assigned':'Standby'}</small></button>`).join('');$('floor').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;render()});$('role').textContent=agents[selected][1];$('desc').textContent=agents[selected][2];$('history').innerHTML=tasks.slice().reverse().map(t=>`<div class="task"><b>${esc(t.name)} · ${esc(t.status)}</b><p>${esc(t.task)}</p>${t.output?`<div class="output">${esc(t.output)}</div>`:''}${t.status==='Assigned'?`<button class="action alt" data-done="${esc(t.id)}">Simulasi selesai</button>`:''}</div>`).join('')||'<p>Belum ada tugas.</p>';$('history').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=tasks.find(t=>t.id===b.dataset.done);if(t)t.status='Demo completed';save()});$('run').disabled=busy;$('clear').disabled=busy;}
function add(status){const task=$('task').value.trim();if(!task){$('notice').textContent='Isi instruksi dahulu.';return}const a=agents[selected];const t={id:crypto.randomUUID(),agent:a[0],name:a[1],task,status,created:new Date().toISOString()};tasks.push(t);save();return t}
$('example').onclick=()=>$('task').value=agents[selected][3];$('demo').onclick=()=>{if(add('Assigned'))$('notice').textContent='Tugas demo dicatat, belum dieksekusi AI.'};$('run').onclick=async()=>{if(busy)return;const token=$('token').value;if(!token){$('notice').textContent='Masukkan kode pilot AI.';return}const t=add('Running');if(!t)return;busy=true;render();$('notice').textContent='Menghubungi AI...';try{const r=await fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({agent:t.agent,task:t.task})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request gagal');t.output=j.output;t.status='AI completed';$('notice').textContent='Draft AI tersedia untuk review.'}catch(e){t.status='Failed';t.output=e.message;$('notice').textContent='AI gagal menjalankan tugas.'}finally{busy=false;save()}};$('clear').onclick=()=>{if(confirm('Hapus semua riwayat lokal?')){tasks=[];save()}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='hr-demo-tasks.json';a.click();URL.revokeObjectURL(u)};render();
</script></html>
